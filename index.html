<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="google-site-verification" content="b5z8WZsVrvTh4qfpKBS9aPgw6NqqwcpSZT4baCGt9QA"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#1B3A5C"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Chapel"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chapel — St. Francis of Assisi</title>
<style>
  :root {
    --navy:#1B3A5C; --gold:#B8942A; --red:#C0392B; --green:#27AE60;
    --blue:#1B6CA8; --purple:#8E44AD; --bg:#F4F5F7; --white:#fff;
    --border:#E8E8E8; --text:#222; --muted:#777; --faint:#AAA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Lato','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;}
  button{cursor:pointer;font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  a{color:var(--blue);}

  /* LOGIN */
  #login-screen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;}
  .login-card{background:#fff;border-radius:16px;padding:48px 44px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  .login-logo{font-family:Georgia,serif;font-size:28px;font-weight:800;color:var(--navy);margin-bottom:4px;}
  .login-sub{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:32px;}
  .login-field{margin-bottom:16px;}
  .login-field label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:6px;}
  .login-field input{width:100%;padding:12px 14px;border:1px solid #DDD;border-radius:8px;font-size:14px;}
  .login-field input:focus{outline:none;border-color:var(--navy);}
  .login-btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;margin-top:8px;}
  .login-btn:hover{background:#254d7a;}
  .login-error{background:#FDEDEC;color:var(--red);border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:16px;}

  /* LAYOUT */
  #app{display:flex;height:100vh;overflow:hidden;}
  #sidebar{width:220px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  #topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  #content{flex:1;overflow-y:auto;padding:28px;}

  /* SIDEBAR */
  .sb-header{padding:20px 20px 14px;border-bottom:1px solid #ffffff18;}
  .sb-logo{font-family:Georgia,serif;font-size:20px;font-weight:800;color:#fff;}
  .sb-site{font-size:10px;color:var(--gold);margin-top:2px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;}
  .sb-ver{font-size:9px;color:#ffffff44;margin-top:1px;}
  .sb-nav{flex:1;padding:8px 0;}
  .sb-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 20px;background:transparent;border:none;border-left:3px solid transparent;color:#ffffff77;font-size:13px;font-weight:400;text-align:left;transition:all 0.15s;}
  .sb-btn:hover{color:#fff;background:#ffffff0d;}
  .sb-btn.active{color:#fff;background:#ffffff15;border-left-color:var(--gold);font-weight:700;}
  .sb-badge{margin-left:auto;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;}
  .sb-footer{padding:12px 20px;border-top:1px solid #ffffff18;}
  .sb-report-btn{width:100%;background:var(--gold);color:#fff;border:none;border-radius:6px;padding:8px 0;font-size:12px;font-weight:700;margin-bottom:8px;}
  .sb-name{font-size:11px;font-weight:700;color:#fff;}
  .sb-role{font-size:10px;color:#ffffff44;}
  .sb-phone{font-size:10px;color:var(--gold);margin-top:1px;}

  /* SITE SWITCHER */
  .site-switcher{display:flex;align-items:center;gap:8px;}
  .site-dot{width:8px;height:8px;border-radius:50%;}
  .site-select{padding:5px 10px;border-radius:6px;border:1px solid var(--border);font-size:13px;background:#fff;font-weight:600;color:var(--navy);}

  /* TOPBAR */
  .topbar-title{font-size:17px;font-weight:700;color:var(--navy);font-family:Georgia,serif;}
  .topbar-actions{display:flex;gap:8px;align-items:center;}

  /* CARDS */
  .stat-row{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 22px;flex:1;min-width:100px;}
  .stat-card.clickable{cursor:pointer;transition:border-color 0.15s;}
  .stat-card.clickable:hover{border-color:var(--navy);}
  .stat-val{font-size:30px;font-weight:800;font-family:Georgia,serif;line-height:1;}
  .stat-lbl{font-size:12px;color:var(--muted);margin-top:4px;}
  .card{background:#fff;border-radius:10px;border:1px solid var(--border);padding:24px;}
  .card-title{font-weight:700;font-size:14px;color:var(--navy);margin-bottom:14px;font-family:Georgia,serif;}
  .two-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

  /* ALERTS */
  .alert{border-radius:10px;padding:14px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
  .alert-body{display:flex;align-items:center;gap:12px;}
  .alert-icon{font-size:20px;}
  .alert-title{font-weight:700;font-size:14px;}
  .alert-sub{font-size:12px;color:var(--muted);}

  /* TABLES */
  .tbl{background:#fff;border-radius:10px;border:1px solid var(--border);overflow:hidden;width:100%;}
  .tbl-head{display:grid;padding:8px 18px;background:#F8F9FA;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:0.06em;}
  .tbl-row{display:grid;padding:11px 18px;border-bottom:1px solid #F0F0F0;align-items:center;cursor:pointer;transition:background 0.1s;}
  .tbl-row:hover{background:#EBF4FB;}
  .tbl-row:nth-child(even){background:#FAFAFA;}
  .tbl-row:nth-child(even):hover{background:#EBF4FB;}

  /* BADGES */
  .pbadge{border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;font-family:monospace;}
  .spill{border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;}

  /* FORMS */
  .form-field{margin-bottom:0;}
  .form-field label{display:block;font-size:11px;font-weight:700;color:#555;margin-bottom:4px;}
  .form-field input,.form-field select,.form-field textarea{width:100%;padding:8px 10px;border-radius:6px;border:1px solid #DDD;font-size:13px;font-family:inherit;}
  .form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--navy);}
  .form-grid{display:grid;gap:12px;}
  .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .span-full{grid-column:1/-1;}

  /* BUTTONS */
  .btn{border:none;border-radius:6px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity 0.15s;}
  .btn:hover{opacity:0.88;}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-ghost{background:#F0F0F0;color:#555;}
  .btn-sm{padding:5px 10px;font-size:11px;}
  .back-btn{background:none;border:none;color:var(--blue);font-size:13px;font-weight:600;margin-bottom:20px;padding:0;cursor:pointer;}

  /* INFO GRID */
  .info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;}
  .info-cell{background:#F8F9FA;border-radius:6px;padding:10px 12px;}
  .info-label{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px;}
  .info-val{font-size:13px;font-weight:600;color:#333;}

  /* CHECKLIST */
  .check-item{display:flex;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;margin-bottom:2px;}
  .check-item:hover{background:#F0F0F0;}
  .check-item.done{background:#EAFAF1;}
  .check-box{width:18px;height:18px;border-radius:3px;border:2px solid #CCC;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all 0.15s;}
  .check-box.checked{background:var(--green);border-color:var(--green);}
  .check-text{font-size:13px;color:#333;}
  .check-text.done{text-decoration:line-through;color:#1E8449;}

  /* CALENDAR */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-day{min-height:70px;padding:5px 4px 3px;border-right:1px solid #F0F0F0;border-bottom:1px solid #F0F0F0;background:#fff;}
  .cal-day.today{background:#EBF4FB;}
  .cal-day.empty{background:#FAFAFA;}
  .cal-num{font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:2px;color:#555;}
  .cal-num.today{background:var(--navy);color:#fff;}
  .cal-evt{border-radius:2px;padding:1px 4px;font-size:9px;font-weight:600;margin-bottom:1px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff;}

  /* REPORT */
  .report-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;display:flex;flex-direction:column;overflow:auto;}
  .report-bar{padding:12px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .report-bar-title{color:#fff;font-weight:700;font-size:14px;}
  .report-body{flex:1;overflow:auto;padding:24px 0;}
  .report-page{background:#fff;max-width:720px;margin:0 auto;padding:36px 44px;font-family:Georgia,serif;}
  .report-header{padding-bottom:14px;margin-bottom:16px;}
  .report-kicker{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;font-family:sans-serif;}
  .report-title{font-size:20px;font-weight:700;color:var(--navy);margin-top:2px;}
  .report-meta{font-size:12px;color:var(--muted);font-family:sans-serif;margin-top:4px;}
  .report-h2{font-size:14px;font-weight:700;color:var(--navy);padding-bottom:5px;margin-bottom:12px;margin-top:22px;}
  .report-row{display:flex;justify-content:space-between;border-bottom:1px solid #F0F0F0;padding:6px 0;font-size:13px;align-items:flex-start;}
  .report-ok{background:#EAFAF1;border:1px solid #A9DFBF;border-radius:6px;padding:10px 14px;font-family:sans-serif;font-size:13px;color:#1E8449;}
  .report-alert{border-radius:6px;padding:10px 14px;margin-bottom:8px;font-family:sans-serif;}
  .report-cards{display:flex;gap:12px;margin:12px 0;font-family:sans-serif;}
  .report-card{background:#F8F9FA;border-radius:8px;padding:12px 16px;flex:1;text-align:center;}
  .report-card-val{font-size:20px;font-weight:800;}
  .report-card-lbl{font-size:11px;color:var(--muted);}
  .report-footer{margin-top:28px;padding-top:12px;display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-family:sans-serif;}
  @media print{.report-bar{display:none!important;}.report-body{padding:0!important;}.report-page{max-width:100%!important;padding:20px!important;}}

  /* ── MOBILE TOP NAV ── */
  #mobile-nav{display:none;}
  #mobile-nav-dropdown{display:none;}

  @media (max-width: 768px) {
    #sidebar{display:none!important;width:0!important;min-width:0!important;overflow:hidden!important;}
    #app{flex-direction:column!important;}
    #main{width:100%!important;max-width:100vw!important;}

    /* Persistent top bar */
    #mobile-nav{
      display:flex;align-items:center;justify-content:space-between;
      background:#1B3A5C;padding:0 10px 0 14px;height:54px;
      flex-shrink:0;z-index:100;
    }

    /* Left: Chapel logo acts as hamburger */
    #mobile-nav-logo{
      font-family:Georgia,serif;font-size:16px;font-weight:800;
      color:#fff;cursor:pointer;padding:8px 6px 8px 0;
      border:none;background:none;font-family:Georgia,serif;
      display:flex;align-items:center;gap:6px;
    }
    #mobile-nav-logo:active{opacity:0.7;}

    /* Right: pinned shortcut icons + overflow indicator */
    #mobile-nav-shortcuts{
      display:flex;align-items:center;gap:2px;
    }
    .mob-shortcut{
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;background:none;border:none;
      color:#ffffffaa;cursor:pointer;padding:6px 7px;
      border-radius:8px;position:relative;min-width:36px;
      font-size:20px;line-height:1;transition:all 0.15s;
    }
    .mob-shortcut:active{background:rgba(255,255,255,0.15);}
    .mob-shortcut.active{color:#fff;background:rgba(255,255,255,0.12);}
    .mob-shortcut-badge{
      position:absolute;top:2px;right:2px;
      background:#B8942A;color:#fff;border-radius:6px;
      padding:0 4px;font-size:8px;font-weight:700;line-height:14px;
    }
    .mob-more-btn{
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;background:none;border:none;
      color:#ffffffaa;cursor:pointer;padding:6px 8px;
      border-radius:8px;font-size:18px;line-height:1;
    }
    .mob-more-btn:active{background:rgba(255,255,255,0.15);}

    /* Full menu dropdown */
    #mobile-nav-dropdown{
      display:none;
      position:fixed;top:54px;left:0;right:0;bottom:0;
      background:#1B3A5C;z-index:99;overflow-y:auto;
      padding:14px;
    }
    #mobile-nav-dropdown.open{display:block;}
    .mob-nav-section{
      font-size:10px;color:#ffffff44;font-weight:700;
      letter-spacing:0.08em;text-transform:uppercase;
      padding:10px 0 6px;grid-column:1/-1;
    }
    .mob-nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
    .mob-nav-item{
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:5px;padding:14px 6px;
      border-radius:10px;background:rgba(255,255,255,0.07);
      border:1px solid transparent;cursor:pointer;
      color:#ffffffbb;font-family:inherit;font-size:11px;
      font-weight:600;text-align:center;min-height:68px;
      transition:all 0.15s;
    }
    .mob-nav-item:active{background:rgba(255,255,255,0.18);}
    .mob-nav-item.active{
      background:rgba(255,255,255,0.15);color:#fff;
      border-color:rgba(184,148,42,0.5);
    }
    .mob-nav-item .mob-icon{font-size:22px;line-height:1;}
    .mob-nav-badge{
      background:#B8942A;color:#fff;border-radius:8px;
      padding:1px 6px;font-size:9px;font-weight:700;
    }
    .mob-nav-footer{
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 0 8px;border-top:1px solid #ffffff18;margin-top:10px;
    }
    .mob-nav-user{font-size:12px;color:#ffffff77;}
    .mob-nav-signout{
      background:none;border:1px solid #ffffff33;color:#ffffff77;
      border-radius:6px;padding:6px 14px;font-size:12px;
      cursor:pointer;font-family:inherit;
    }

    #main{flex-direction:column;}
    #mobile-site-switcher select{
      background:rgba(255,255,255,0.12);color:#fff;
      border:1px solid rgba(255,255,255,0.25);border-radius:6px;
      padding:4px 8px;font-size:12px;font-weight:600;
      font-family:inherit;cursor:pointer;max-width:100px;
    }
    #mobile-site-switcher select option{background:#1B3A5C;color:#fff;}
    #topbar{display:none!important;}
    #content{padding:14px;}
    .stat-row{flex-direction:column;gap:10px;}
    .stat-card{min-width:unset;}
    .two-grid{grid-template-columns:1fr;}
    .info-grid{grid-template-columns:1fr 1fr;}
    .form-grid-2{grid-template-columns:1fr;}
    .form-grid-3{grid-template-columns:1fr;}
    .tbl-head,.tbl-row{font-size:11px;}
    .report-page{padding:20px 16px!important;}
    .report-cards{flex-wrap:wrap;}
    .report-card{min-width:calc(50% - 6px);}
  }

  /* TOAST */
  #toast{position:fixed;bottom:20px;right:20px;background:#1E8449;color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.2);z-index:9999;display:none;}

  /* LOADING */
  .loading{text-align:center;padding:60px;color:var(--faint);font-size:14px;}
  .spinner{display:inline-block;width:24px;height:24px;border:3px solid #E8E8E8;border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;display:flex;align-items:center;justify-content:center;}
  .modal{background:#fff;border-radius:12px;padding:24px;max-width:420px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,0.2);}
  .modal-title{font-size:15px;font-weight:700;color:var(--navy);font-family:Georgia,serif;margin-bottom:16px;}

  /* PROGRESS BAR */
  .progress-bar{background:#E0E0E0;border-radius:4px;height:6px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:4px;transition:width 0.3s;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">⛪ Chapel</div>
    <div class="login-sub">Facilities Management</div>
    <div id="login-error" class="login-error" style="display:none"></div>
    <div class="login-field">
      <label>Email Address</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sb-header">
      <button id="sb-toggle" onclick="toggleSidebar()" title="Toggle menu">☰</button>
      <div id="sb-header-text">
        <div class="sb-logo">⛪ Chapel</div>
        <div class="sb-site" id="sb-site-name">St. Francis of Assisi</div>
        <div class="sb-ver">v5.0 · Facilities</div>
      </div>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-footer">
      <button class="sb-report-btn" onclick="navTo('reporting')">📊 Reporting</button>
      <div class="sb-name" id="sb-user-name">Jason Snoreck</div>
      <div class="sb-role" id="sb-user-role">Facilities Director</div>
      <div class="sb-phone">(708) 269-7148</div>
    </div>
  </div>

  <!-- Mobile Top Nav -->
  <div id="mobile-nav">
    <button id="mobile-nav-logo" onclick="toggleMobileNav()">⛪ Chapel</button>
    <div id="mobile-site-switcher"></div>
    <div id="mobile-nav-shortcuts"></div>
  </div>
  <div id="mobile-nav-dropdown">
    <div id="mob-nav-content"></div>
    <div class="mob-nav-footer">
      <div class="mob-nav-user" id="mob-user-name">Jason Snoreck</div>
      <button class="mob-nav-signout" onclick="localStorage.clear();location.reload()">Sign Out</button>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-actions">
        <div class="site-switcher" id="site-switcher"></div>
        <button class="btn btn-gold" onclick="navTo('report')">Report Issue</button>
      </div>
    </div>
    <div id="content">
      <div class="loading"><div class="spinner"></div><br>Loading Chapel...</div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const PB = window.location.hostname === 'localhost' || window.location.hostname.match(/^192\./)
  ? `http://${window.location.hostname}:8090`
  : `http://${window.location.hostname}:8090`;

// Since nginx proxies /api and /_/ we can use relative URLs
const API = '/api';

// ── STATE ────────────────────────────────────────────────────────────────────
let STATE = {
  token: localStorage.getItem('chapel_token') || '',
  user: JSON.parse(localStorage.getItem('chapel_user') || 'null'),
  sites: [],
  currentSite: null,
  view: 'dashboard',
  buildings: [],
  vendors: [],
  orders: [],
  log: [],
  inventory: [],
  recur: [],
  queue: [],
  checks: [],
  events: [],
  users: [],
  draft: null,
  activeReport: null,
  cart: JSON.parse(localStorage.getItem('chapel_cart') || '[]'),
};

// ── API HELPERS ──────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(STATE.token ? { 'Authorization': STATE.token } : {})
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${API}/${path}`, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `API error ${res.status}`);
  }
  return res.json();
}

async function getAll(collection, filter = '', sort = '-created') {
  let url = `collections/${collection}/records?perPage=200&sort=${sort}`;
  if (filter) url += `&filter=${encodeURIComponent(filter)}`;
  const res = await api('GET', url);
  return res.items || [];
}

async function create(collection, data) {
  return api('POST', `collections/${collection}/records`, data);
}

async function update(collection, id, data) {
  return api('PATCH', `collections/${collection}/records/${id}`, data);
}

async function remove(collection, id) {
  return api('DELETE', `collections/${collection}/records/${id}`);
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  try {
    const res = await fetch('/api/collections/chapel_auth/auth-with-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identity: email, password })
    });

    if (!res.ok) throw new Error('Invalid email or password.');
    const data = await res.json();
    STATE.token = data.token;

    // Look up user profile by email
    const profileRes = await fetch('/api/collections/user_profiles/records?filter=' + encodeURIComponent('auth_email="' + email + '"') + '&perPage=1', {
      headers: { 'Authorization': data.token }
    });
    const profileData = await profileRes.json();
    const profile = profileData.items && profileData.items[0];

    STATE.user = profile ? {
      id: profile.id,
      name: profile.display_name,
      email: email,
      role: profile.role,
      site_access: profile.site_access || 'SFA',
      phone: profile.phone || '',
    } : {
      id: data.record && data.record.id ? data.record.id : 'user',
      name: email,
      email: email,
      role: 'readonly',
      site_access: 'SFA',
      phone: '',
    };
    localStorage.setItem('chapel_token', STATE.token);
    localStorage.setItem('chapel_user', JSON.stringify(STATE.user));
    await initApp();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

// Handle Enter key on login
document.getElementById('login-password').addEventListener('keydown', e => {

});

async function initApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  // Load sites
  STATE.sites = await getAll('sites', 'active=true', 'name');

  // Set current site based on user profile
  const siteAccess = STATE.user?.site_access || 'SFA';
  const allowedCodes = siteAccess.split(',').map(s => s.trim());
  const allowedSites = STATE.sites.filter(s => allowedCodes.includes(s.code));
  STATE.allowedSites = allowedSites;
  STATE.currentSite = allowedSites.length > 0 ? allowedSites[0] : STATE.sites[0];

  // Update UI
  document.getElementById('sb-user-name').textContent = STATE.user?.name || 'User';
  document.getElementById('sb-user-role').textContent = STATE.user?.role || '';

  buildSiteSwitcher();
  buildNav();
  buildMobileNav();
  const mobName = document.getElementById('mob-user-name');
  if (mobName) mobName.textContent = STATE.user ? STATE.user.name : 'User';
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div><br>Loading Chapel...</div>';
  await loadSiteData();
  navTo('dashboard');
}

function buildSiteSwitcher() {
  const el = document.getElementById('site-switcher');
  const isAdmin = STATE.user?.role === 'admin';

  const visibleSites = STATE.allowedSites || STATE.sites;
  if (visibleSites.length > 1) {
    el.innerHTML = `
      <div class="site-dot" style="background:${STATE.currentSite?.color||'#1B3A5C'}"></div>
      <select class="site-select" onchange="switchSite(this.value)">
        ${isAdmin ? `<option value="ALL" ${!STATE.currentSite ? 'selected' : ''}>All Sites</option>` : ''}
        ${visibleSites.map(s => `<option value="${s.id}" ${STATE.currentSite?.id === s.id ? 'selected' : ''}>${s.short_name||s.name}</option>`).join('')}
      </select>
    `;
  } else {
    el.innerHTML = `
      <div class="site-dot" style="background:${STATE.currentSite?.color||'#1B3A5C'}"></div>
      <span style="font-size:13px;font-weight:600;color:#1B3A5C">${STATE.currentSite?.short_name || STATE.currentSite?.name || 'Chapel'}</span>
    `;
  }
  document.getElementById('sb-site-name').textContent = STATE.currentSite?.short_name || 'Chapel';
}

async function switchSite(val) {
  if (val === 'ALL') {
    STATE.currentSite = null;
  } else {
    STATE.currentSite = STATE.sites.find(s => s.id === val);
  }
  buildSiteSwitcher();
  buildMobileNav();
  await loadSiteData();
  navTo(STATE.view);
}

async function loadSiteData() {
  const siteFilter = STATE.currentSite ? `site="${STATE.currentSite.id}"` : '';
  const [buildings, vendors, orders, log, inventory, recur, queue, checks, events, users] = await Promise.all([
    getAll('buildings', siteFilter ? siteFilter + '&&active=true' : 'active=true', 'name'),
    getAll('vendors', siteFilter ? siteFilter + '&&active=true' : 'active=true', 'company'),
    getAll('work_orders', siteFilter, '-date_reported'),
    getAll('log_entries', siteFilter, '-date_completed'),
    getAll('inventory', siteFilter, 'name'),
    getAll('recurring_schedules', siteFilter, 'title'),
    getAll('queue_items', siteFilter, '-created'),
    getAll('checklists', siteFilter, 'due_date'),
    getAll('events', siteFilter, 'date'),
    Promise.resolve([]),
  ]);
  STATE.buildings = buildings;
  STATE.vendors = vendors;
  STATE.orders = orders;
  STATE.log = log;
  STATE.inventory = inventory;
  STATE.recur = recur;
  STATE.queue = queue;
  STATE.checks = checks;
  STATE.events = events;
  STATE.users = users;
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function today() { return new Date().toISOString().split('T')[0]; }
function fmtDate(d) { if(!d)return'—'; const p=d.split('T')[0].split('-'); return `${p[1]}/${p[2]}/${p[0]}`; }
function ago(d) { const x=Math.floor((Date.now()-new Date(d))/86400000); return x===0?'Today':x===1?'Yesterday':`${x}d ago`; }
function du(d) { return Math.ceil((new Date(d.split('T')[0])-new Date())/86400000); }
function mlbl() { const n=new Date(); return ['January','February','March','April','May','June','July','August','September','October','November','December'][n.getMonth()]+' '+n.getFullYear(); }
function mpfx() { return new Date().toISOString().slice(0,7); }

// ── CALENDAR EXPORT ───────────────────────────────────────────────────────────
function calDate(d) {
  // Convert YYYY-MM-DD to YYYYMMDD for iCal
  if (!d) return '';
  return d.split('T')[0].replace(/-/g,'');
}

function calDateTime(d) {
  // All-day event format
  return calDate(d) || '';
}

function makeICS(title, date, endDate, description, location) {
  const uid = 'chapel-' + Date.now() + '@sfaorland.org';
  const now = new Date().toISOString().replace(/[-:.]/g,'').slice(0,15) + 'Z';
  const start = calDate(date);
  const end = calDate(endDate || date);
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Chapel//St. Francis of Assisi//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:' + uid,
    'DTSTAMP:' + now,
    'DTSTART;VALUE=DATE:' + start,
    'DTEND;VALUE=DATE:' + end,
    'SUMMARY:' + (title||'').replace(/,/g,'\,'),
    'DESCRIPTION:' + (description||'').replace(/[\n]/g,"\\n").replace(/,/g,"\\,"),
    'LOCATION:' + (location||'St. Francis of Assisi, Orland Park IL').replace(/,/g,'\,'),
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  return ics;
}

function downloadICS(title, date, endDate, description, location) {
  const ics = makeICS(title, date, endDate, description, location);
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = title.replace(/[^a-z0-9]/gi,'_').toLowerCase() + '.ics';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Calendar file downloaded.');
}

function googleCalURL(title, date, description, location) {
  const d = calDate(date);
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    dates: d + '/' + d,
    details: description || '',
    location: location || 'St. Francis of Assisi, 15050 S. Wolf Rd., Orland Park, IL',
  });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

function outlookCalURL(title, date, description, location) {
  const params = new URLSearchParams({
    path: '/calendar/action/compose',
    rru: 'addevent',
    subject: title,
    startdt: date || '',
    enddt: date || '',
    body: description || '',
    location: location || 'St. Francis of Assisi, Orland Park, IL',
  });
  return 'https://outlook.live.com/calendar/0/action/compose?' + params.toString();
}

function calButtons(title, date, description, location) {
  if (!date) return '';
  const gUrl = googleCalURL(title, date, description, location);
  const oUrl = outlookCalURL(title, date, description, location);
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
    <a href="${gUrl}" target="_blank" style="background:#4285F4;color:#fff;border-radius:5px;padding:5px 10px;font-size:11px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px">📅 Google</a>
    <button onclick="downloadICS('${title.replace(/'/g,"\'")}','${date}','${date}','${(description||'').replace(/'/g,"\'")}','${(location||'').replace(/'/g,"\'")}');event.stopPropagation()" style="background:#555;color:#fff;border:none;border-radius:5px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px">📅 Apple/iCal</button>
    <a href="${oUrl}" target="_blank" style="background:#0078D4;color:#fff;border-radius:5px;padding:5px 10px;font-size:11px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px">📅 Outlook</a>

        return `<div class="tbl-row" style="grid-template-columns:1fr 90px 90px 100px 140px;background:${isOv?'#FFF9F9':i%2===0?'#fff':'#FAFAFA'};opacity:${r.active?1:0.5};cursor:default">
          <div><div style="font-size:13px;font-weight:600;color:#222">${r.title}</div><div style="font-size:11px;color:#AAA">${r.category}</div></div>
          <div style="font-size:12px;color:#555">${r.interval}</div>
          <div style="font-size:12px;color:#555">${r.building_scope||'All'}</div>

          <div style="display:flex;gap:4px;flex-wrap:wrap">
            ${r.active?`<button class="btn btn-sm" style="background:${isOv?'#C0392B':'#1B3A5C'};color:#fff" onclick="genQueue('${r.id}')">→ Queue</button>`:''}
            <button class="btn btn-ghost btn-sm" onclick="toggleSchedule('${r.id}')">${r.active?'Pause':'Resume'}</button>
            ${r.next_due?`<button class="btn btn-ghost btn-sm" onclick="downloadICS('${r.title.replace(/'/g,"\'")}','${r.next_due}','${r.next_due}','${r.title.replace(/'/g,"\'")} — Due ${r.next_due}','St. Francis of Assisi');event.stopPropagation()" style="color:#555">📅 iCal</button>`:''}

      }).join('')}

}

async function genQueue(id) {
  const r = STATE.recur.find(x=>x.id===id);
  try {
    const item = await create('queue_items', {
      site: r.site, title: r.title, category: r.category,
      building_scope: r.building_scope, priority: r.priority,
      vendor_name: r.vendor_name||'', due_date: r.next_due,
      notes: r.notes||'', assignee:'', status:'Pending',
    });
    STATE.queue.unshift(item);
    // Advance next due
    const d=new Date(r.next_due);
    const iv=r.interval;
    if(iv==='Daily')d.setDate(d.getDate()+1);
    else if(iv==='Weekly')d.setDate(d.getDate()+7);
    else if(iv==='Monthly')d.setMonth(d.getMonth()+1);
    else if(iv==='Quarterly')d.setMonth(d.getMonth()+3);
    else if(iv==='Semi-annual')d.setMonth(d.getMonth()+6);
    else d.setFullYear(d.getFullYear()+1);
    const newDue = d.toISOString().split('T')[0];
    await update('recurring_schedules', id, { next_due: newDue });
    r.next_due = newDue;
    showToast(`"${r.title}" added to queue.`);
    document.getElementById('content').innerHTML = renderSchedules();
  } catch(e) { showToast('Error: '+e.message); }
}

async function toggleSchedule(id) {
  const r = STATE.recur.find(x=>x.id===id);
  await update('recurring_schedules', id, { active: !r.active });

  document.getElementById('content').innerHTML = renderSchedules();
}

function renderCheckDetail() {
  const ck = CK_STATE.sel;

  const all = items.length;
  return `
    ${backBtn("CK_STATE.sel=null;CK_STATE.checked={};renderChecklists()")}
    <div class="card" style="max-width:600px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">

        <div class="progress-bar" style="flex:1"><div class="progress-fill" style="width:${all?Math.round(done/all*100):0}%;background:${done===all?'#27AE60':'#1B3A5C'}"></div></div>

          ? `<button class="btn ${done===all?'btn-green':'btn-ghost'}" onclick="completeChecklist('${ck.id}',${done===all})">${done===all?'✓ Mark Complete':`${all-done} items remaining`}</button>`

async function saveLogEntry() {
  const desc = document.getElementById('lf-desc').value.trim();
  if (!desc) return;
  try {
    const rec = await create('log_entries', {
      site: STATE.currentSite?.id,
      date_completed: document.getElementById('lf-date').value,
      completed_by: document.getElementById('lf-by').value,
      vendor_name: document.getElementById('lf-vendor').value,
      building_name: STATE.buildings.find(b=>b.id===document.getElementById('lf-bldg').value)?.name||'',
      category: document.getElementById('lf-cat').value,
      location: document.getElementById('lf-loc').value,
      equipment_name: document.getElementById('lf-eq').value,
      cost: parseFloat(document.getElementById('lf-cost').value||0),
      invoice_number: document.getElementById('lf-inv').value,

      work_order_id: document.getElementById('lf-wo').value,

}

// ── CALENDAR ──────────────────────────────────────────────────────────────────
let CAL_STATE = { yr: new Date().getFullYear(), mo: new Date().getMonth(), selEv: null };
const TC = {Service:'#1B6CA8',Inspection:'#C0392B',Internal:'#27AE60','Contractor Visit':'#8E44AD'};
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function renderCalendar() {
  const {yr,mo} = CAL_STATE;
  const f1=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate();
  const cells=[...new Array(f1).fill(null),...Array.from({length:dim},(_,i)=>i+1)];
  while(cells.length%7!==0)cells.push(null);
  const ms=`${yr}-${String(mo+1).padStart(2,'0')}`;
  const upcoming=STATE.events.filter(e=>du(e.date)>=0).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,6);

  return `
    <div style="display:grid;grid-template-columns:1fr 260px;gap:20px">
      <div>
        <div style="background:#fff;border-radius:10px;border:1px solid #E8E8E8;overflow:hidden">
          <div style="background:#1B3A5C;padding:12px 18px;display:flex;align-items:center;justify-content:space-between">
            <button onclick="CAL_STATE.mo===0?(CAL_STATE.mo=11,CAL_STATE.yr--):CAL_STATE.mo--;document.getElementById('content').innerHTML=renderCalendar()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer">‹</button>
            <div style="color:#fff;font-weight:700;font-size:15px;font-family:Georgia,serif">${MONTHS[mo]} ${yr}</div>
            <button onclick="CAL_STATE.mo===11?(CAL_STATE.mo=0,CAL_STATE.yr++):CAL_STATE.mo++;document.getElementById('content').innerHTML=renderCalendar()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer">›</button>
          </div>
          <div class="cal-grid" style="border-bottom:1px solid #E8E8E8">
            ${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div style="padding:6px 0;text-align:center;font-size:11px;font-weight:700;color:#999">${d}</div>`).join('')}
          </div>
          <div class="cal-grid">
            ${cells.map(day=>{
              if(!day)return`<div class="cal-day empty"></div>`;
              const ds=`${ms}-${String(day).padStart(2,'0')}`;
              const devs=STATE.events.filter(e=>e.date&&e.date.startsWith(ds));
              const isT=ds===today();
              return `<div class="cal-day ${isT?'today':''}">
                <div class="cal-num ${isT?'today':''}">${day}</div>
                ${devs.slice(0,2).map(ev=>`<div class="cal-evt" style="background:${TC[ev.type]||'#1B6CA8'}" onclick="CAL_STATE.selEv=STATE.events.find(x=>x.id==='${ev.id}');document.getElementById('content').innerHTML=renderCalendar()">${ev.title}</div>`).join('')}
                ${devs.length>2?`<div style="font-size:9px;color:#999">+${devs.length-2}</div>`:''}
              </div>`;
            }).join('')}
          </div>
        </div>
        <div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap">
          ${Object.entries(TC).map(([t,c])=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#555"><div style="width:10px;height:10px;border-radius:2px;background:${c}"></div>${t}</div>`).join('')}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <button class="btn btn-navy" onclick="showAddEvent()" style="width:100%;padding:9px 0">+ Add Event</button>
        <div class="card">
          <div class="card-title">Upcoming</div>
          ${upcoming.map(e=>{const d=du(e.date);return `
            <div onclick="CAL_STATE.selEv=STATE.events.find(x=>x.id==='${e.id}');document.getElementById('content').innerHTML=renderCalendar()" style="padding:7px 0;border-bottom:1px solid #F0F0F0;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start">
              <div style="flex:1"><div style="font-size:12px;font-weight:600;color:#222">${e.title}</div><div style="font-size:10px;color:#AAA">${e.vendor_name||'Internal'}</div></div>
              <div style="text-align:right;margin-left:8px"><div style="font-size:11px;font-weight:700;color:${d<=7?'#C0392B':d<=14?'#D35400':'#555'}">${fmtDate(e.date)}</div><div style="font-size:10px;color:#AAA">${d===0?'Today':d+'d'}</div></div>
            </div>`;}).join('')}
        </div>
      </div>
    </div>
    ${CAL_STATE.selEv?`
      <div class="modal-overlay" onclick="CAL_STATE.selEv=null;document.getElementById('content').innerHTML=renderCalendar()">
        <div class="modal" onclick="event.stopPropagation()">
          <div style="display:flex;justify-content:space-between;margin-bottom:12px">
            <div class="modal-title">${CAL_STATE.selEv.title}</div>
            <button onclick="CAL_STATE.selEv=null;document.getElementById('content').innerHTML=renderCalendar()" style="background:none;border:none;font-size:16px;cursor:pointer;color:#AAA">✕</button>
          </div>
          ${[['Date',fmtDate(CAL_STATE.selEv.date)],['Type',CAL_STATE.selEv.type],['Building',CAL_STATE.selEv.building_scope||'All'],['Vendor',CAL_STATE.selEv.vendor_name||'—'],['Notes',CAL_STATE.selEv.notes||'—']].map(([l,v])=>`<div style="display:flex;gap:10px;margin-bottom:6px"><div style="font-size:11px;color:#999;width:50px;flex-shrink:0;font-weight:700">${l}</div><div style="font-size:13px;color:#333">${v}</div></div>`).join('')}
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid #F0F0F0">

async function saveEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const date = document.getElementById('ev-date').value;
  if(!title||!date) return;
  try {
    const rec = await create('events', {
      site: STATE.currentSite?.id, title, date,
      type: document.getElementById('ev-type').value,
      vendor_name: document.getElementById('ev-vendor').value,
      building_scope: 'All',
      notes: document.getElementById('ev-notes').value,
    });
    STATE.events.push(rec);
    showToast('Event added.');
    document.getElementById('content').innerHTML = renderCalendar();
  } catch(e) { showToast('Error: '+e.message); }
}

async function submitIssue() {
  const title = document.getElementById('ri-title').value.trim();
  const desc = document.getElementById('ri-desc').value.trim();
  if(!title||!desc) return;
  try {
    const rec = await create('work_orders', {
      site: STATE.currentSite?.id,
      title, location: document.getElementById('ri-loc').value,
      building: document.getElementById('ri-bldg').value,
      priority: document.getElementById('ri-pri').value,
      status: 'Open', category: 'General',
      reporter: document.getElementById('ri-name').value || 'Anonymous',
      date_reported: today(), notes: desc, cost: 0, assignee:'',
    });
    STATE.orders.unshift(rec);
    showToast('Issue reported! Thank you.');
    navTo('dashboard');
  } catch(e) { showToast('Error: '+e.message); }
}

function roleBadge(role) {
  const c = role==='admin'?{bg:'#1B3A5C15',color:'#1B3A5C'}:role==='staff'?{bg:'#1B6CA815',color:'#1B6CA8'}:{bg:'#F8F9FA',color:'#777'};
  return `<span style="background:${c.bg};color:${c.color};border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700">${role||'readonly'}</span>`;
}

function siteBadges(siteAccess) {
  if (!siteAccess) return '<span style="color:#AAA;font-size:11px">None</span>';
  return siteAccess.split(',').map(s => s.trim()).filter(Boolean).map(s =>
    `<span style="background:#EBF4FB;color:#1B6CA8;border-radius:3px;padding:1px 6px;font-size:10px;font-weight:700;margin-right:3px">${s}</span>`
  ).join('');
}

async function createUser() {
  const name     = document.getElementById('au-name').value.trim();
  const email    = document.getElementById('au-email').value.trim();
  const password = document.getElementById('au-password').value;
  const phone    = document.getElementById('au-phone').value.trim();
  const role     = document.getElementById('au-role').value;
  const sites    = STATE.sites.filter(s => document.getElementById('au-site-'+s.code)?.checked).map(s=>s.code).join(',');

  if (!name || !email || !password) { showToast('Name, email, and password are required.'); return; }
  if (!sites) { showToast('Select at least one site.'); return; }

  try {
    // Create chapel_auth record
    await api('POST', 'collections/chapel_auth/records', {
      email, password, passwordConfirm: password
    });

    // Create user_profiles record
    await api('POST', 'collections/user_profiles/records', {
      auth_email: email, display_name: name,
      role, site_access: sites, phone, active: true
    });

    showToast(`✓ ${name} added successfully.`);
    USER_STATE.view = 'list';
    navTo('settings');
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

async function saveEditUser() {
  const u       = USER_STATE.sel;
  const name    = document.getElementById('eu-name').value.trim();
  const phone   = document.getElementById('eu-phone').value.trim();
  const role    = document.getElementById('eu-role').value;
  const sites   = STATE.sites.filter(s => document.getElementById('eu-site-'+s.code)?.checked).map(s=>s.code).join(',');
  const newPass = document.getElementById('eu-password').value;

  if (!name) { showToast('Name is required.'); return; }
  if (!sites) { showToast('Select at least one site.'); return; }

  try {
    // Update user_profiles
    await update('user_profiles', u.profileId, {
      display_name: name, role, site_access: sites, phone
    });

    // Update password if provided
    if (newPass) {
      await update('chapel_auth', u.authId, {
        password: newPass, passwordConfirm: newPass
      });
    }

    showToast(`✓ ${name} updated.`);
    USER_STATE.view = 'list';
    navTo('settings');
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

async function deactivateUser(profileId) {
  await update('user_profiles', profileId, { active: false });
  showToast('User deactivated.');
  navTo('settings');
}

async function activateUser(profileId) {
  await update('user_profiles', profileId, { active: true });
  showToast('User activated.');
  navTo('settings');
}

async function syncUsers() {
  await loadUserManagement();
  const unmatched = USER_STATE.authUsers.filter(u =>
    !USER_STATE.profiles.find(p => p.auth_email?.toLowerCase() === u.email?.toLowerCase())
  );
  let count = 0;
  for (const u of unmatched) {
    const displayName = u.email.split('@')[0].split(' ').map(w=>w?w[0].toUpperCase()+w.slice(1):'').join(' ');
    await api('POST', 'collections/user_profiles/records', {
      auth_email: u.email, display_name: displayName,
      role: 'readonly', site_access: 'SFA', phone: '', active: true
    });
    count++;
  }
  showToast(`✓ Created ${count} missing profile${count!==1?'s':''}. Update roles and sites as needed.`);
  navTo('settings');
}

function buildMobileNav() {
  const shortcutsEl = document.getElementById('mobile-nav-shortcuts');
  const dropdown = document.getElementById('mob-nav-content');
  if (!shortcutsEl || !dropdown) return;

  const shortcuts = JSON.parse(localStorage.getItem('chapel_shortcuts') || 'null') || DEFAULT_SHORTCUTS;
  const allItems = getMobAllItems();

  // Build shortcut buttons
  shortcutsEl.innerHTML = shortcuts.map(id => {
    const n = allItems.find(x => x.id === id);
    if (!n) return '';
    const isActive = STATE.view === n.id;
    if (n.external) {
      return '<a href="' + n.external + '" class="mob-shortcut" title="' + n.label + '">' + n.icon + '</a>';
    }
    return '<button class="mob-shortcut ' + (isActive?'active':'') + '" onclick="mobileNavTo(\'' + n.id + '\')" title="' + n.label + '">' +
      n.icon +
      (n.badge ? '<span class="mob-shortcut-badge">' + n.badge + '</span>' : '') +
    '</button>';
  }).join('') +
  '<button class="mob-more-btn" onclick="toggleMobileNav()" title="More">⋯</button>';

  // Build full dropdown menu
  const sections = [
    { label:'Facilities', ids:['dashboard','orders','queue','recurring','checklists','log','inventory','calendar','reporting','vendors','report','settings'] },
    { label:'Supply', ids:['supply'] },
  ];

  dropdown.innerHTML = sections.map(section => {
    const items = section.ids.map(id => allItems.find(x => x.id === id)).filter(Boolean);
    return '<div class="mob-nav-grid">' +
      '<div class="mob-nav-section">' + section.label + '</div>' +
      items.map(n => {
        if (n.external) {
          return '<a href="' + n.external + '" class="mob-nav-item" style="text-decoration:none">' +
            '<span class="mob-icon">' + n.icon + '</span>' +
            '<span>' + n.label + '</span>' +
          '</a>';
        }
        return '<button class="mob-nav-item ' + (STATE.view===n.id?'active':'') + '" onclick="mobileNavTo(\'' + n.id + '\')">' +
          '<span class="mob-icon">' + n.icon + '</span>' +
          '<span>' + n.label + '</span>' +
          (n.badge ? '<span class="mob-nav-badge">' + n.badge + '</span>' : '') +
        '</button>';
      }).join('') +
    '</div>';
  }).join('');

  const nameEl = document.getElementById('mob-user-name');
  if (nameEl) nameEl.textContent = STATE.user ? STATE.user.name : 'User';

  // Build mobile site switcher
  const mobSite = document.getElementById('mobile-site-switcher');
  if (mobSite) {
    const visibleSites = STATE.allowedSites || STATE.sites;
    const isAdminUser = STATE.user && STATE.user.role === 'admin';
    if (visibleSites.length > 1) {
      mobSite.innerHTML = '<select onchange="switchSite(this.value)" style="background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.25);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;max-width:110px">' +
        (isAdminUser ? '<option value="ALL" ' + (!STATE.currentSite?'selected':'') + '>All Sites</option>' : '') +
        visibleSites.map(s => '<option value="' + s.id + '" ' + (STATE.currentSite?.id===s.id?'selected':'') + '>' + (s.short_name||s.code) + '</option>').join('') +
      '</select>';
    } else {
      mobSite.innerHTML = '<span style="color:#ffffff88;font-size:12px;font-weight:600">' + (STATE.currentSite?.short_name||STATE.currentSite?.code||'') + '</span>';
    }
  }
}

function toggleMobileNav() {
  const dropdown = document.getElementById('mobile-nav-dropdown');
  if (!dropdown) return;
  const isOpen = dropdown.classList.contains('open');
  if (isOpen) {
    dropdown.classList.remove('open');
  } else {
    buildMobileNav();
    dropdown.classList.add('open');
  }
}

function mobileNavTo(id) {
  const dropdown = document.getElementById('mobile-nav-dropdown');
  if (dropdown) dropdown.classList.remove('open');
  navTo(id);
  buildMobileNav(); // refresh shortcut active states
}

// ── STARTUP ────────────────────────────────────────────────────────────────────
// Check if already logged in
if (STATE.token && STATE.user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div><br>Loading Chapel...</div>';
  initApp().catch(() => {
    localStorage.clear();
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  });
}
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Chapel SW registered:', reg.scope))
      .catch(err => console.log('SW registration failed:', err));
  });
}
</script>
